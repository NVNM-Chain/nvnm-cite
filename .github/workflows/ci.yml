name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Python 3.11 matches the dev environment and the runtime image.
      - run: uv sync --frozen --python 3.11
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nvnm-chain/nvnm-cite
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nvnm-cite:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the real image and hit it the way monitoring will: / must serve,
      # /api/status must report a reachable mainnet RPC, the right chain id,
      # full manifest coverage, a manifest-consistent sentinel registry, and
      # telemetry OFF (the required production default).
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8787:8787 nvnm-cite:smoke
          trap 'echo "--- container logs ---"; docker logs smoke || true; docker rm -f smoke || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8787/ && break
            sleep 1
          done
          curl -fsS http://localhost:8787/ | grep -qi nvnm
          curl -fsS http://localhost:8787/api/status -o status.json
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["app"]["name"] == "nvnm-cite", s["app"]
          assert s["chain"]["rpc_ok"] and s["chain"]["chain_id_ok"], s["chain"]
          assert s["coverage"]["count"] >= 2114, s["coverage"]
          sentinel = s["registries"]["us-scotus"]
          assert sentinel["exists"] and sentinel["name_matches_manifest"], sentinel
          assert s["telemetry"] == {"enabled": False}, s["telemetry"]
          print("smoke OK:", s["app"], "chain", s["chain"]["chain_id"],
                "coverage", s["coverage"]["count"])
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip tag]')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Version lives in pyproject.toml (bumped in the PR). This job only
      # writes a git tag — never a commit — so it cannot retrigger itself.
      - name: Tag pyproject version
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject version is not MAJOR.MINOR.PATCH: ${VER}"
            exit 1
          fi
          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
